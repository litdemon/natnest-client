name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. 테스트 ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime dependencies
        run: pip install requests

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  # ── 2. Windows 바이너리 빌드 ──────────────────────────────────────────
  build-windows:
    name: Build Windows Binary
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build natnest.exe
        run: pyinstaller natnest_win.spec --clean

      - name: Verify binary
        run: dist\natnest.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: natnest-windows
          path: dist/natnest.exe
          retention-days: 7

  # ── 3. Linux 바이너리 빌드 ────────────────────────────────────────────
  build-linux:
    name: Build Linux Binary
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build natnest
        run: pyinstaller natnest.spec --clean

      - name: Bundle VERSION alongside binary
        run: cp VERSION dist/VERSION

      - name: Verify binary
        run: ./dist/natnest --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: natnest-linux
          path: dist/natnest
          retention-days: 7
